appId: com.cpppilot.agent
productName: CppPilot
electronDist: node_modules/electron/dist
directories:
  output: ../../release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/cat.GIF
    to: cat.GIF
  - from: build/icon.png
    to: tray-icon.png
  - from: build/icon.ico
    to: app-icon.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  signExecutable: false
nsis:
  oneClick: true
  perMachine: false
  artifactName: "${productName} Setup ${version}.${ext}"
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CppPilot
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: "CppPilot ${version}"
  packElevateHelper: false
